.demoIdentity > div {
  font-size: 14px;
  font-weight: 600;
}

@media (max-width: 760px) {
  .demoIdentity > div {
    font-size: 11px;
  }
}
/* 共用边距：宽屏最多 80px，窄屏自动缩小 */
.space > .side:last-child {
  --recommendation-offset: clamp(0px, 5vw, 80px);
}

#retainedLabel {
  margin-left: var(--recommendation-offset);
}

/* 推荐区域与标题左侧对齐 */
#retained.floating {
  width: auto;
  margin-left: var(--recommendation-offset);
  margin-right: 0;
  padding: 8px 0 12px;
}

/* 左列 */
#retained.floating .song:nth-child(n) {
  width: 66.6667%;
  align-self: flex-start;
  margin: 0;
}

/* 右列左边缘对齐左列中线 */
#retained.floating .song:nth-child(even) {
  margin-left: 33.3333%;
}

/* 10 首歌的列表位置 */
#retained.list {
 margin-left: var(--recommendation-offset);
  margin-top: 12px;   /* 与上方标题的距离 */
}

#retained.list .song {
  padding-left: 10px;
  box-sizing: border-box;
}

/* 关键词恢复边框 */
#soundTags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

#soundTags span {
  font-size: 12px;
  line-height: 1.5;
  padding: 3px 9px;
  border: 1px solid #dafa8828;
  border-radius: 20px;
  color: #c9d6ad;
  background: transparent;
}

/* 去掉关键词之间的点 */
#soundTags span + span::before {
  content: none;
}

/* 保留推荐文字上方的空隙 */
#suggestion #reason {
  margin-top: 24px;
}
/* 去掉 WHY THIS TRACK 整块的外边框，保留背景 */
#suggestion {
  border: none;
}

:root {
  --accent: #dafa88;
}

/* 标题保持主色 */
#suggestion .eyebrow {
  color: var(--accent);
}

/* 播放进度条 */
#progress {
  background: var(--accent);
}

/* 关键词更淡、更偏灰 */
#soundTags span {
  color: color-mix(in srgb, var(--accent) 30%, #94999f);
  border-color: color-mix(in srgb, var(--accent) 20%, transparent);
}

#reviewSource {
  color: #b8bdc4b7; /* 平时：灰白色 */
  transition: color 0.2s ease;
}

#reviewSource:hover,
#reviewSource:focus-visible {
  color: color-mix(in srgb, var(--accent) 30%, #94999f); /* 悬停：绿色 */
}

/* 三栏：中间唱片稍微放大 */
.space {
  --record-size: 300px;

  grid-template-columns:
    minmax(0, 1fr)
    var(--record-size)
    minmax(0, 1fr);

  align-items: start;
}

/* 只放大唱片，歌名和按钮不跟着放大 */
.player {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto auto 1fr;
}

.record {
  width: var(--record-size);
  grid-column: 1 / -1;
}

.player > h1,
.player > .artist,
.player > .progress,
.player > .time {
  grid-column: 1 / -1;
}

/* 上一首 / 下一首与喜欢 / 收藏放在同一排 */
#transport {
  grid-column: 2;
  grid-row: 4;
  margin: 16px 0 0;
  gap: 12px;
}

#feedback {
  grid-column: 3;
  grid-row: 4;
  margin: 16px 0 0 12px;
  gap: 12px;
  flex-wrap: nowrap;
  align-items: center;
}

/* Act 模式没有切歌按钮，喜欢和收藏单独居中 */
body[data-mode="3"] #feedback {
  grid-column: 2 / 4;
  margin-left: 0;
  justify-content: center;
}

/* 两侧与唱片保持相同距离 */
.space {
  column-gap: 120px;
}

/* 两侧的上下布局 */
.space > .side {
  height: var(--record-size);
  min-height: 0;
  margin-block: 0;
  padding-block: 0;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-self: start;
}

/* 左侧内容朝唱片靠拢 */
#suggestion,
#queue {
  width: 100%;
  max-width: 285px;
  box-sizing: border-box;
  margin-left: auto;
  margin-right: 0;
}

/* 右侧内容朝唱片靠拢 */
#retainedLabel,
#retained.list {
  width: 100%;
  max-width: 285px;
  box-sizing: border-box;
  margin-left: 0;
  margin-right: auto;
}

/* 保留列表滚动 */
.space > .side > #retained,
.space > .side > #queue {
  min-height: 0;
  overflow-y: auto;
}

.space > .side > #retainedLabel {
  flex-shrink: 0;
}

/* 窄屏：唱片在上，两侧内容在下 */
@media (max-width: 760px) {
  .space {
    --record-size: min(320px, 80vw);
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: 24px;
  }

  .player {
    width: var(--record-size);
    grid-column: 1 / -1;
    grid-row: 1;
    margin: 10px auto;
  }

  .space > .side {
    height: auto;
    justify-content: flex-start;
  }
}

/* 桌面：两侧独立微调 */
@media (min-width: 761px) {
  .space > .side:first-child {
    /* 左侧：WHY THIS TRACK / UP NEXT */
    --move-x: -20px;
    --move-y: 100px;

    position: relative;
    left: var(--move-x);
    top: var(--move-y);
  }

  .space > .side:last-child {
    /* 右侧：推荐歌曲和标题 */
    --move-x: 0px;
    --move-y: 50px;

    position: relative;
    left: var(--move-x);
    top: var(--move-y);
  }
}

/* 歌手名字下方留白 */
.player > .artist {
  margin-bottom: 18px;
}

/* 5 首及以下全部展开，不出现滚动条 */
.space > .side > #retained.list.expanded {
  max-height: none;
  min-height: auto;
  overflow: visible;
  flex-shrink: 0;
}

/* 只把 WHY THIS TRACK 向左移动 */
@media (min-width: 761px) {
  #suggestion {
    position: relative;
    left: -20px;
  }
}

/* 唱片下方留白，歌名和下面的按钮一起下移 */
.player > h1 {
  margin-top: 32px;
}

/* 顶部 DEMO 标题与整个音乐区域拉开距离 */
main {
  padding-top: 80px;
}

/* controller 与上方音乐区域拉开距离 */
.controller {
  margin-top: 30px;
}

/* 去掉唱片中心的小孔 */
.recordHole {
  display: none;
}

.queueRow {
  display: flex;
  align-items: center;
  gap: 8px;
}

.queueMarker {
  width: 14px;
  flex-shrink: 0;
  font-size: 11px;
  color: var(--accent, #dafa88);
}

.queueRow > .song {
  flex: 1;
  min-width: 0;
}

.queueRow.is-current .song b {
  color: var(--accent, #dafa88);
}

/* 切歌时不再重播卡片入场动画 */
#queueSongs .song,
#retained .song {
  animation: none;
}

/* 播放标记平滑显隐 */
.queueMarker {
  opacity: 0;
  transform: translateX(-4px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.queueRow.is-current .queueMarker {
  opacity: 1;
  transform: translateX(0);
}

/* 当前歌曲文字平滑变色 */
.queueRow .song b {
  transition: color 0.2s ease;
}

/* Keep selected-value spacing without displaying the text. */
#historyValue, #agencyValue, #memoryValue {
  visibility: hidden;
  height: 40px;
  min-height: 0;
  margin: 0;
  padding: 0;
  overflow: hidden;
}
.controller .control label { min-height: 0; }

/* Five labels follow the five slider positions rather than equal-width text boxes. */
#history + .ticks { display: block; position: relative; height: 20px; margin-inline: 8px; }
#history + .ticks span { position: absolute; white-space: nowrap; width: auto; text-align: center; transform: translateX(-50%); }
#history + .ticks span:nth-child(1) { left: 0; transform: none; }
#history + .ticks span:nth-child(2) { left: 25%; }
#history + .ticks span:nth-child(3) { left: 50%; }
#history + .ticks span:nth-child(4) { left: 75%; }
#history + .ticks span:nth-child(5) { right: 0; transform: none; }

/* 时间范围说明：独立于音乐标签 */
#suggestion .tasteContext {
  margin-top: 9px;
  color: #c5c8cc;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.6;
}
#suggestion .tasteContext + #soundTags { margin-top: 12px; }
#reviewSource[hidden], #reason[hidden] { display: none; }

function choosePosition(target,{keepFuture=false,backwards=false}={}){

 render();start();return true;
}
function selectTrack(id){

function transitionQueueTo(target,options,direction){
 const queue=$('queueSongs');
 queue.querySelectorAll('.queueExit').forEach(row=>row.remove());
 const rows=[...queue.querySelectorAll('.queueRow')];
 const before=rows.map(row=>({id:row.dataset.queueTrack,top:row.getBoundingClientRect().top}));
 const exitIndex=direction===1?0:rows.length-1;
 const outgoing=rows[exitIndex]?.cloneNode(true);
 const changed=choosePosition(target,options);
 if(changed&&before.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const duration=440,easing='cubic-bezier(.22,1,.36,1)';
  const step=before[1].top-before[0].top;
  const after=[...queue.querySelectorAll('.queueRow')];
  after.forEach(row=>{
   const old=before.find(item=>item.id===row.dataset.queueTrack);
   const offset=old?old.top-row.getBoundingClientRect().top:direction*step;
   row.animate([{transform:`translateY(${offset}px)`,opacity:old?1:0},{transform:'translateY(0)',opacity:1}],{duration,easing});

function moveQueuedTrack(id,targetId){

function shuffleUpcoming(){

let suppressQueueClick=false;

function bindQueueReordering(){
 $('queueSongs').querySelectorAll('[data-reorder]').forEach(handle=>{
  handle.onkeydown=event=>{
   if(!['ArrowUp','ArrowDown'].includes(event.key))return;
   event.preventDefault();
   const id=handle.dataset.reorder,index=futureTracks.findIndex(i=>tracks[i].id===id);
   const target=futureTracks[index+(event.key==='ArrowUp'?-1:1)];
   if(target!==undefined&&moveQueuedTrack(id,tracks[target].id))$('queueSongs').querySelector(`[data-reorder="${id}"]`)?.focus();
  };
  const row=handle.closest('.queueRow');
  row.classList.add('reorderable');
  row.ondragstart=event=>event.preventDefault();
  row.onpointerdown=event=>{
   if(event.button!==0||+$('agency').value!==0)return;
   const originX=event.clientX,originY=event.clientY;
   let dragging=false,targetId=null;
   const slots=[...$('queueSongs').querySelectorAll('.queueRow')].filter(el=>el.querySelector('[data-reorder]')).map(el=>({el,id:el.dataset.queueTrack,rect:el.getBoundingClientRect()}));
   const rowRect=row.getBoundingClientRect();
   row.setPointerCapture(event.pointerId);
   const clearTargets=()=> $('queueSongs').querySelectorAll('.dropTarget').forEach(el=>el.classList.remove('dropTarget'));
   row.onpointermove=e=>{
    if(!dragging&&Math.hypot(e.clientX-originX,e.clientY-originY)<6)return;
    if(!dragging){dragging=true;suppressQueueClick=true;row.classList.add('dragging');}
    e.preventDefault();clearTargets();
    const dy=Math.max(slots[0].rect.top-rowRect.top,Math.min(slots[slots.length-1].rect.top-rowRect.top,e.clientY-originY));
    row.style.transform=`translate3d(0,${dy}px,0)`;
    // Use original slot geometry: the moving row must not intercept drop targeting.
    const center=rowRect.top+rowRect.height/2+dy;
    const nearest=slots.reduce((best,slot)=>Math.abs(slot.rect.top+slot.rect.height/2-center)<Math.abs(best.rect.top+best.rect.height/2-center)?slot:best,slots[0]);
    targetId=nearest.id;
    if(targetId!==handle.dataset.reorder)nearest.el.classList.add('dropTarget');
   };
   const finish=e=>{
    if(row.hasPointerCapture(e.pointerId))row.releasePointerCapture(e.pointerId);
    const before=new Map([...$('queueSongs').querySelectorAll('.queueRow')].map(el=>[el.dataset.queueTrack,el.getBoundingClientRect().top]));
    row.classList.remove('dragging');clearTargets();
    row.style.transform='';
    const id=handle.dataset.reorder;
    row.onpointermove=null;row.onpointerup=null;row.onpointercancel=null;
    if(dragging){
     if(e.type==='pointerup'&&targetId&&moveQueuedTrack(id,targetId))$('queueSongs').querySelector(`[data-reorder="${id}"]`)?.focus({preventScroll:true});
     if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
      $('queueSongs').querySelectorAll('.queueRow').forEach(el=>{
       const previousTop=before.get(el.dataset.queueTrack);
       if(previousTop===undefined)return;
       const delta=previousTop-el.getBoundingClientRect().top;
       if(Math.abs(delta)>.5)el.animate([{transform:`translateY(${delta}px)`},{transform:'translateY(0)'}],{duration:320,easing:'cubic-bezier(.22,1,.36,1)'});
      });
     }
     setTimeout(()=>{suppressQueueClick=false;},0);
    }else if(e.type==='pointerup'&&!event.target.closest('[data-reorder]')){
     // Pointer capture retargets click to the row: handle a simple tap explicitly.
     suppressQueueClick=true;selectTrack(id);setTimeout(()=>{suppressQueueClick=false;},0);
    }
   };
   row.onpointerup=finish;row.onpointercancel=finish;
  };
 });
}

function updateControllerLift(){
 if($('controllerPanel').hidden)return;
 const stage=document.querySelector('#experience > .space');
 const time=document.querySelector('.player .time');
 const header=document.querySelector('body > header');

 document.body.style.setProperty('--music-stage-y',-Math.ceil(lift)+'px');
}
